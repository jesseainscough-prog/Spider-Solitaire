function faceHTML(card){
 let suit=card.suit||'♠',isRed=suit==='♥'||suit==='♦',red=isRed?' style="color:#b01828"':'';
 let index=`<span class="card-suit-index${isRed?' red':''}">${suit}</span><span class="card-rank-index${isRed?' red':''}">${card.rank}</span>`;
 if(courtPortraits[card.rank]) return `${index}<div class="court-face"><div class="court-index"${red}><span>${card.rank}</span><b>${suit}</b></div><img class="court-portrait" src="${courtPortraits[card.rank]}" alt="" draggable="false"></div>`;
 return `${index}<div class="card-body-suit${isRed?' red':''}">${suit}</div><div class="rank"${red}>${card.rank}</div><div class="suit"${red}>${suit}</div>`;
}

  setTimeout(()=>showGritSplash(()=>{if(!showOnboarding())showDailyInvite()}),120);resetInactivity();
}catch(err){
  console.error(err);
  status.textContent='Game failed to start: '+err.message;
  toast('Startup error');
}
})();




</script>
</body>
</html>
