<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#06462e" />
  <title>Spider Solitaire 1.0D</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-main">♠ SPIDER</div>
        <div class="brand-sub">SOLITAIRE</div>
      </div>

      <div class="stats">
        <div class="stat"><span>Score</span><strong id="score">500</strong></div>
        <div class="stat"><span>Moves</span><strong id="moves">0</strong></div>
        <div class="stat"><span>Time</span><strong id="timer">00:00</strong></div>
      </div>

      <button id="newGameTop" class="icon-btn" aria-label="New game">↻</button>
    </header>

    <div class="subbar">
      <span>1 Suit • Smart Tap</span>
      <span>v1.0D</span>
    </div>

    <section id="board" class="board" aria-label="Spider Solitaire board">
      <div class="watermark">♠</div>
      <div id="columns" class="columns"></div>

      <div id="completed" class="completed" aria-label="Completed runs"></div>

      <div class="stock-wrap">
        <div id="stock" class="stock"></div>
        <div id="stockLabel">5 Deals Left</div>
      </div>
    </section>

    <footer class="toolbar">
      <button id="undo" class="toolbar-btn" disabled>↶ Undo</button>
      <button id="hint" class="toolbar-btn">💡 Hint</button>
      <button id="deal" class="toolbar-btn deal-btn">▣ Deal</button>
    </footer>
  </main>

  <div id="status" class="status" aria-live="polite">
    Tap a movable card or stack. If there is a good legal move, it will move automatically.
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
